<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Jobs</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .navbar {
            height: 70px;
            background: #2563eb;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #1e3a8a;
        }

        .jobs-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .job-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        .job-card h2 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .company {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .details {
            color: #64748b;
            margin-bottom: 15px;
        }

        .description {
            color: #555;
            margin-bottom: 20px;
        }

        .apply-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media(max-width: 700px) {

            .jobs-container {
                grid-template-columns: 1fr;
            }

        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header p {
            margin-top: 8px;
            color: #64748b;
        }

        .post-job-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .post-job-btn:hover {
            background: #1d4ed8;
        }

        @media(max-width: 700px) {

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .post-job-btn {
                width: 100%;
                text-align: center;
            }

        }

        .details-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
        }

        .details-btn:hover {
            background: #1d4ed8;
        }

        .view-btn {
            display: inline-block;

            background: #2563eb;
            color: white;

            padding: 10px 20px;

            border-radius: 6px;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }
    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            CareerConnect
        </div>

        <div class="nav-links">

            <a href="/home">Dashboard</a>

            <a href="/profile">Profile</a>

        </div>

    </div>


    <div class="container">

        <div class="page-header">

            <div>
                <h1>Available Jobs</h1>

                <p>
                    Explore job opportunities and find the right career for you.
                </p>
            </div>

        </div>

        <div class="jobs-container">

            <div class="job-card" th:each="job : ${jobs}">

                <h2 th:text="${job.title}">
                    Software Developer
                </h2>

                <div class="company" th:text="${job.company}">
                    Company Name
                </div>

                <div class="details">

                    📍 <span th:text="${job.location}"></span>

                    &nbsp; | &nbsp;

                    <span th:text="${job.salary}"></span>

                    &nbsp; | &nbsp;

                    <span th:text="${job.jobType}"></span>

                </div>

                <div class="description" th:text="${job.description}">
                    Job description
                </div>

                <a th:href="@{/jobs/{id}(id=${job.id})}" class="details-btn">
                    View Details
                </a>

            </div>

        </div>

    </div>

</body>

</html>
