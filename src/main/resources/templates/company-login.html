<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerConnect - Company Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f4f7fb; padding: 30px 0; }
        .box { width: 400px; padding: 35px; background: white; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
        .logo { text-align: center; margin-bottom: 10px; font-size: 30px; font-weight: bold; color: #2563eb; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-weight: bold; color: #333; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 7px; font-size: 15px; }
        textarea { min-height: 80px; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; }
        button { width: 100%; padding: 12px; border: none; border-radius: 7px; background: #2563eb; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .message { margin-bottom: 15px; text-align: center; color: green; }
        .error { margin-bottom: 15px; text-align: center; color: red; }
        .link { margin-top: 20px; text-align: center; color: #555; font-size: 14px; }
        .link a { color: #2563eb; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
    <div class="logo">CareerConnect</div>
    <div class="subtitle">Company Recruitment Portal</div>

    <div th:if="${message}" class="message"><span th:text="${message}"></span></div>
    <div th:if="${error}" class="error"><span th:text="${error}"></span></div>

    <form action="/company/login" method="post">
        <div class="form-group">
            <label for="email">Company Email</label>
            <input type="email" id="email" name="email" placeholder="Enter company email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit">Login</button>
    </form>

    <div class="link">New company? <a href="/company/signup">Register Company</a></div>
    <div class="link">Are you a student? <a href="/login">Student Login</a></div>
</div>
</body>
</html>
