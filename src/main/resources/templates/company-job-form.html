<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerConnect - Create Job</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f7fb; color: #333; }
        .navbar { height: 70px; background: #2563eb; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
        .logo { font-size: 25px; font-weight: bold; }
        .nav-links a { color: white; text-decoration: none; margin-left: 25px; }
        .nav-links a.current { font-weight: bold; text-decoration: underline; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #1e3a8a; }
        .subtitle { margin-top: 8px; color: #64748b; margin-bottom: 25px; }
        .card { background: white; padding: 22px 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.07); margin-bottom: 16px; }
        .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
        .card h2 { color: #2563eb; font-size: 18px; margin-bottom: 6px; }
        .company { font-weight: bold; color: #475569; margin-bottom: 10px; }
        .meta { color: #64748b; font-size: 13px; line-height: 1.7; }
        .status { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .status.Applied { background: #dbeafe; color: #1d4ed8; }
        .status.Shortlisted { background: #fef3c7; color: #b45309; }
        .status.Selected { background: #dcfce7; color: #15803d; }
        .status.Rejected { background: #fee2e2; color: #b91c1c; }
        .empty { background: white; padding: 40px; border-radius: 12px; text-align: center; color: #64748b; box-shadow: 0 4px 15px rgba(0,0,0,0.07); }
        .btn { display: inline-block; background: #2563eb; color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; }
        .btn:hover { background: #1d4ed8; }
        .banner { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .banner a { color: #2563eb; font-weight: bold; }
        .section-title { color: #1f2937; font-size: 18px; margin: 30px 0 14px; }
        .form-card { max-width: 800px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .full { grid-column: 1 / -1; }
        label { display: block; font-weight: bold; margin-bottom: 7px; color: #334155; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 14px; }
        textarea { min-height: 100px; resize: vertical; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">CareerConnect &middot; Company</div>
    <div class="nav-links">
        <a href="/company/dashboard">My Jobs</a>
        <a href="/company/jobs/new">+ Create Job</a>
        <a href="/company/logout">Logout</a>
    </div>
</div>
<div class="container">
    <div class="form-card">
        <h1>Create Job Opening</h1>
        <p class="subtitle">Posting as <strong th:text="${company.name}">Company</strong></p>

        <div class="card">
            <form action="/company/jobs/new" method="post">
                <div class="grid">
                    <div class="full">
                        <label>Job Title *</label>
                        <input type="text" name="title" required>
                    </div>
                    <div>
                        <label>Location *</label>
                        <input type="text" name="location" required>
                    </div>
                    <div>
                        <label>Job Type *</label>
                        <select name="jobType" required>
                            <option value="Full Time">Full Time</option>
                            <option value="Part Time">Part Time</option>
                            <option value="Internship">Internship</option>
                            <option value="Contract">Contract</option>
                        </select>
                    </div>
                    <div>
                        <label>Salary (e.g. 6 LPA)</label>
                        <input type="text" name="salary">
                    </div>
                    <div>
                        <label>Openings</label>
                        <input type="number" name="openings" min="1">
                    </div>
                    <div class="full">
                        <label>Description *</label>
                        <textarea name="description" required></textarea>
                    </div>
                    <div class="full">
                        <label>Required Skills * (comma separated)</label>
                        <input type="text" name="skills" placeholder="Java, Spring Boot, SQL" required>
                    </div>
                    <div>
                        <label>Eligible Departments</label>
                        <input type="text" name="eligibleDepartments" placeholder="CSE, IT, ECE">
                    </div>
                    <div>
                        <label>Minimum CGPA</label>
                        <input type="number" step="0.01" min="0" max="10" name="minimumCgpa">
                    </div>
                    <div>
                        <label>Graduation Year</label>
                        <input type="text" name="graduationYear">
                    </div>
                    <div>
                        <label>Application Deadline</label>
                        <input type="date" name="applicationDeadline">
                    </div>
                    <div class="full">
                        <label>Recruitment Process</label>
                        <textarea name="recruitmentProcess" placeholder="Aptitude test, Technical interview, HR round"></textarea>
                    </div>
                </div>
                <div style="margin-top:22px; text-align:right;">
                    <a href="/company/dashboard" style="margin-right:15px; color:#64748b;">Cancel</a>
                    <button type="submit" class="btn">Create Job</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
